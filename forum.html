    <style>
        .font-display {
            font-family: 'Clash Display', sans-serif;
        }

        #messages-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            /* Do NOT use justify-content:flex-end — it breaks overflow-y scroll. */
            /* Use a flex spacer (.msg-spacer) injected at the top instead. */
        }

        /* Grows when few messages exist (pushes them down), collapses when content overflows */
        .msg-spacer {
            flex: 1;
        }

        /* Use dynamic viewport height on mobile so the input stays above the keyboard */
        @supports (height: 100dvh) {
            body {
                height: 100dvh;
            }
        }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
        }

        .message.own {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .bubble {
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message.own .bubble {
            background-color: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.other .bubble {
            background-color: #f1f5f9;
            color: #1e293b;
            border-bottom-left-radius: 4px;
        }

        .meta {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 4px;
            font-weight: 500;
        }

        /* Custom scrollbar */
        #messages-list::-webkit-scrollbar {
            width: 6px;
        }

        #messages-list::-webkit-scrollbar-track {
            background: #f8fafc;
        }

        #messages-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        #messages-list::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ── Strict Mobile Viewport Fix ──
           Forces body to exact screen dimensions so input isn't pushed off-screen.
           100dvh respects mobile browser address/nav bars. */
        body,
        html {
            height: 100%;
            height: -webkit-fill-available;
            margin: 0;
            overflow: hidden;
            /* Stop whole page scrolling; child divs handle scroll */
        }

        body {
            /* Fallback to standard vh, override with dvh if browser supports it */
            height: 100vh;
        }

        @supports (height: 100dvh) {
            body {
                height: 100dvh;
            }
        }

        /* Force modals to absolute front regardless of any parent stacking context */
        [id^="modal-"] {
            z-index: 9999 !important;
            position: fixed !important;
            pointer-events: auto !important;
        }

        /* Subtle backdrop blur for a premium look */
        [id^="modal-"].modal-open {
            backdrop-filter: blur(2px);
        }

        /* Delete button — only visible on hover over own message */
        .message.own .msg-delete {
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .message.own:hover .msg-delete {
            opacity: 1;
        }
    </style>
</head>

                const authContainerScreen = document.getElementById('authContainer');
                const authContainer = document.getElementById('authTitle');
                const forumContainer = document.getElementById('forumMain');
                const messagesList = document.getElementById('messages-list');
                const userEmailDisplay = document.getElementById('userEmailDisplay');
                const authError = document.getElementById('authError');
                const authSuccess = document.getElementById('authSuccess');
                const emailInput = document.getElementById('email');
                const passwordInput = document.getElementById('password');
                const messageInput = document.getElementById('messageInput');
                const myGroupsList = document.getElementById('my-groups-list');
                const chatHeaderTitle = document.getElementById('chat-header-title');
                const chatHeaderSubtitle = document.getElementById('chat-header-subtitle');
                const chatHeaderActions = document.getElementById('chat-header-actions');

                // Watch Authentication State
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        handleLogin(user);
                    } else {
                        handleLogout();
                    }
                });

                function handleLogin(user) {
                    currentUser = user;
                    authContainerScreen.classList.add('hidden');
                    forumContainer.classList.remove('hidden');
                    userEmailDisplay.textContent = user.email.split('@')[0];

                    switchContext('general', 'General Chat');
                    listenToMyGroups();
                }

                function handleLogout() {
                    currentUser = null;
                    authContainerScreen.classList.remove('hidden');
                    forumContainer.classList.add('hidden');

                    if (unsubscribeMessages) unsubscribeMessages();
                    if (myGroupsListener) myGroupsListener();

                    messagesList.innerHTML = '';
                    myGroupsList.innerHTML = '<div class="text-xs text-gray-400 italic px-2">No groups joined yet...</div>';
                    currentChatId = 'general';
                }

                // reCAPTCHA v3 — invisible, score-based (no checkbox needed)
                async function verifyRecaptcha(action = 'login') {
                    if (typeof grecaptcha === 'undefined') return true; // skip during local dev without internet
                    try {
                        const token = await grecaptcha.execute('6LftA34sAAAAAGAYDgjQ4RCsCUeBmE6GQvgauRPm', { action });
                        // v3 tokens are sent to Google server-side for score verification.
                        // Here we simply confirm the token was successfully obtained (non-empty).
                        // For full protection, pass `token` to a Cloud Function for server-side score check.
                        return token && token.length > 0;
                    } catch (e) {
                        console.warn('reCAPTCHA error:', e);
                        return true; // fail-open so legitimate users aren't blocked
                    }
                }

                window.loginWithGoogle = async function () {
                    clearMessages();
                    await verifyRecaptcha('login');

                    const provider = new GoogleAuthProvider();
                    try {
                        await signInWithPopup(auth, provider);
                        showSuccess("Google Sign-in successful!");
                    } catch (error) {
                        showError(error.message);
                    }
                };

                window.login = async function () {
                    clearMessages();
                    await verifyRecaptcha('login');

                    const email = emailInput.value.trim();
                    const password = passwordInput.value;
                    if (!email || !password) return showError("Please enter email and password");

                    try {
                        await signInWithEmailAndPassword(auth, email, password);
                    } catch (error) {
                        showError(error.message);
                    }
                };

                window.signup = async function () {
                    clearMessages();
                    await verifyRecaptcha('signup');

                    const email = emailInput.value.trim();
                    const password = passwordInput.value;
                    if (!email || !password) return showError("Please enter email and password");

                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                        showSuccess("Signup successful! You can now chat.");
                    } catch (error) {
                        showError(error.message);
                    }
                };

                window.logout = async function () {
                    try {
                        await signOut(auth);
                    } catch (error) {
                        console.error("Logout Error:", error);
                    }
                };

                // --- Chat & Group Logic ---

                window.switchContext = function (chatId, chatName, isCreator = false, inviteCode = null) {
                    currentChatId = chatId;
                    currentChatName = chatName;

                    chatHeaderTitle.textContent = chatName;

                    // Highlight active button
                    document.querySelectorAll('#my-groups-list button, #btn-general-chat').forEach(btn => {
                        btn.classList.remove('bg-blue-100', 'text-blue-700');
                        btn.classList.add('text-gray-700', 'hover:bg-gray-100');
                    });

                    if (chatId === 'general') {
                        document.getElementById('btn-general-chat').classList.add('bg-blue-100', 'text-blue-700');
                        document.getElementById('btn-general-chat').classList.remove('text-gray-700', 'hover:bg-gray-100');
                        chatHeaderSubtitle.textContent = 'Public Forum';
                        chatHeaderActions.innerHTML = '';
                    } else {
                        const groupBtn = document.getElementById(`btn-group-${chatId}`);
                        if (groupBtn) {
                            groupBtn.classList.add('bg-blue-100', 'text-blue-700');
                            groupBtn.classList.remove('text-gray-700', 'hover:bg-gray-100');
                        }
                        if (inviteCode) {
                            chatHeaderSubtitle.innerHTML = `Private Group &bull; Code: <span class="font-bold text-gray-800 bg-gray-100 px-1 rounded">${inviteCode}</span>`;
                        } else {
                            chatHeaderSubtitle.textContent = `Public Group`;
                        }

                        if (isCreator) {
                            const btn = document.createElement('button');
                            btn.className = 'text-xs text-red-500 hover:bg-red-50 px-2 py-1 rounded transition';
                            btn.textContent = 'Delete Group';
                            btn.dataset.chatId = chatId;
                            btn.addEventListener('click', () => deleteGroup(btn.dataset.chatId));
                            chatHeaderActions.innerHTML = '';
                            chatHeaderActions.appendChild(btn);
                        } else {
                            const btn = document.createElement('button');
                            btn.className = 'text-xs text-gray-500 hover:bg-gray-100 px-2 py-1 rounded transition';
                            btn.textContent = 'Leave Group';
                            btn.dataset.chatId = chatId;
                            btn.addEventListener('click', () => leaveGroup(btn.dataset.chatId));
                            chatHeaderActions.innerHTML = '';
                            chatHeaderActions.appendChild(btn);
                        }
                    }

                    // Reset messages list but keep the flex spacer
                    resetMessagesList('Loading conversation...');
                    subscribeToMessages();
                    closeModals();
                    closeSidebarOnMobile();
                };

                // Always call this instead of messagesList.innerHTML = '...'
                // to preserve the .msg-spacer that makes bottom-align + scroll work
                function resetMessagesList(placeholderText = '') {
                    messagesList.innerHTML = '';
                    const spacer = document.createElement('div');
                    spacer.className = 'msg-spacer';
                    messagesList.appendChild(spacer);
                    if (placeholderText) {
                        const ph = document.createElement('div');
                        ph.className = 'text-center text-gray-400 py-10 m-auto placeholder-msg';
                        ph.textContent = placeholderText;
                        messagesList.appendChild(ph);
                    }
                }

                function subscribeToMessages() {
                    if (unsubscribeMessages) {
                        unsubscribeMessages();
                    }

                    const chatPath = currentChatId === 'general' ? 'forum_messages' : `group_messages/${currentChatId}`;
                    const messagesRef = query(ref(db, chatPath), orderByChild('createdAt'), limitToLast(100));

                    const listener = onChildAdded(messagesRef, (snapshot) => {
                        const msg = snapshot.val();
                        appendMessageToUI(msg, snapshot.key);
                        scrollToBottom();
                    }, (error) => {
                        console.error("Error fetching messages:", error);
                        if (error.code && error.code.includes('PERMISSION_DENIED')) {
                            resetMessagesList();
                            const errDiv = document.createElement('div');
                            errDiv.className = 'bg-red-50 text-red-800 p-4 border border-red-200 rounded-lg text-sm m-4';
                            errDiv.innerHTML = '<strong>Developer Note:</strong> Firebase rules are blocking access.';
                            messagesList.appendChild(errDiv);
                        }
                    });

                    unsubscribeMessages = listener;
                }

                function appendMessageToUI(msg, msgKey) {
                    const isOwn = currentUser && msg.userId === currentUser.uid;
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${isOwn ? 'own' : 'other'}`;

                    // Format timestamp (handles Firebase serverTimestamp latency gracefully)
                    let timeStr = 'Just now';
                    if (msg.createdAt) {
                        const date = new Date(msg.createdAt);
                        timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }

                    const username = msg.username || 'Anonymous';

                    // Build DOM safely to avoid XSS from username or content
                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'meta';
                    metaDiv.textContent = `${username} • ${timeStr}`;

                    const bubbleDiv = document.createElement('div');
                    bubbleDiv.className = 'bubble';
                    bubbleDiv.textContent = msg.content; // textContent auto-escapes HTML

                    msgDiv.appendChild(metaDiv);
                    msgDiv.appendChild(bubbleDiv);

                    // Show delete button only on own messages
                    if (isOwn && msgKey) {
                        const delBtn = document.createElement('button');
                        delBtn.className = 'msg-delete mt-1 text-red-400 hover:text-red-600 transition flex items-center gap-1 text-xs';
                        delBtn.title = 'Delete message';
                        delBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg> Delete`;
                        delBtn.addEventListener('click', () => deleteMessage(msgKey, msgDiv));
                        msgDiv.appendChild(delBtn);
                    }

                    // Remove placeholder if present (but keep the .msg-spacer)
                    const placeholder = messagesList.querySelector('.placeholder-msg');
                    if (placeholder) placeholder.remove();

                    messagesList.appendChild(msgDiv);
                }

                async function deleteMessage(msgKey, msgDiv) {
                    if (!confirm('Delete this message?')) return;
                    const chatPath = currentChatId === 'general' ? 'forum_messages' : `group_messages/${currentChatId}`;
                    try {
                        await remove(ref(db, `${chatPath}/${msgKey}`));
                        msgDiv.remove(); // immediately remove from UI
                    } catch (e) {
                        console.error('Failed to delete message:', e);
                        alert('Could not delete message.');
                    }
                }

                // ── Layer 2: Content / Sensitivity Filter ────────────────────────────────
                // Blocks messages containing profanity or ad-policy-violating content
                // BEFORE they reach Firebase. Words are stored as regex fragments so
                // l33t-speak substitutions (e.g. "sh1t") are also caught.
                const BLOCKED_PATTERNS = [
                    // Adult / profanity
                    /\bf+[u*@]+c+k+s?\b/i, /\bs+h+[i1!]+t+s?\b/i, /\bb+[i1]+t+c+h+e?s?\b/i,
                    /\ba+s+s+h+o+l+e+s?\b/i, /\bd+[i1]+c+k+s?\b/i, /\bp+[u*]+s+s+[yi]\b/i,
                    /\bc+[u*]+n+t+s?\b/i, /\bb+[a@]+s+t+[a@]+r+d+s?\b/i,
                    /\bm+[o0]+t+h+e+r+f+[u*]+c+k/i, /\bn+[i1]+g+g+[ae]+r/i,
                    /\bs+[e3]+x+[yu]\b/i, /\bp+[o0]+r+n/i, /\bn+[u*]+d+e/i,
                    /\bx+x+x/i, /\be+s+c+[o0]+r+t/i, /\bx+-?r+[a@]+t+e+d/i,
                    // Spam / scam phrases
                    /\bclick\s+here\s+to\s+(win|earn|claim)/i,
                    /\b(earn|make)\s+\$?\d+\s*(per\s*(day|hour)|daily|fast)/i,
                    /\bwhatsapp\s*(group|link|num)/i,
                    /\b(t\.?me|telegram\.?me)\/\S+/i,
                    /\bjoin\s+my\s+(group|channel|class)/i,
                ];

                function isContentSafe(text) {
                    for (const pattern of BLOCKED_PATTERNS) {
                        if (pattern.test(text)) return false;
                    }
                    return true;
                }

                window.sendMessage = async function (e) {
                    e.preventDefault();
                    const content = messageInput.value.trim();
                    if (!content || !currentUser) return;

                    // ── Content filter check ────────────────────────────────────────────
                    if (!isContentSafe(content)) {
                        // Flash red border on input instead of an intrusive alert
                        messageInput.style.borderColor = '#ef4444';
                        messageInput.placeholder = '⚠️ Message contains prohibited content.';
                        setTimeout(() => {
                            messageInput.style.borderColor = '';
                            messageInput.placeholder = 'Type your message...';
                        }, 3000);
                        return;
                    }

                    const username = currentUser.email.split('@')[0];
                    messageInput.value = '';

                    const chatPath = currentChatId === 'general' ? 'forum_messages' : `group_messages/${currentChatId}`;

                    try {
                        await push(ref(db, chatPath), {
                            userId: currentUser.uid,
                            username: username,
                            content: content,
                            createdAt: serverTimestamp()
                        });
                    } catch (error) {
                        console.error("Error sending message:", error);
                        alert("Failed to send message. Enable Developer Tools to check console.");
                    }
                };

                // UI Helpers
                function scrollToBottom() {
                    messagesList.scrollTop = messagesList.scrollHeight;
                }

                function escapeHTML(str) {
                    return str
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;")
                        .replace(/'/g, "&#039;");
                }

                function showError(msg) {
                    authError.textContent = msg;
                    authError.classList.remove('hidden');
                    authSuccess.classList.add('hidden');
                }

                function showSuccess(msg) {
                    authSuccess.textContent = msg;
                    authSuccess.classList.remove('hidden');
                    authError.classList.add('hidden');
                }

                function clearMessages() {
                    authError.classList.add('hidden');
                    authSuccess.classList.add('hidden');
                }

                // --- Modals & Group Actions ---
                window.toggleSidebar = function (forceClose = false) {
                    const sidebar = document.getElementById('chatSidebar');
                    const backdrop = document.getElementById('sidebarBackdrop');
                    if (forceClose === true || !sidebar.classList.contains('-translate-x-full')) {
                        sidebar.classList.add('-translate-x-full');
                        backdrop.classList.add('hidden');
                    } else {
                        sidebar.classList.remove('-translate-x-full');
                        backdrop.classList.remove('hidden');
                    }
                };

                function closeSidebarOnMobile() {
                    if (window.innerWidth < 768) {
                        window.toggleSidebar(true);
                    }
                }

                // Generates a unique invite code by checking for collisions in Firebase
                async function generateInviteCode() {
                    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                    let code;
                    let attempts = 0;
                    do {
                        code = '';
                        for (let i = 0; i < 6; i++) {
                            if (i === 3) code += '-';
                            code += chars.charAt(Math.floor(Math.random() * chars.length));
                        }
                        // Check for collision using the same lookup used by joinPrivateGroup
                        const existing = await get(query(ref(db, 'groups'), orderByChild('inviteCode'), equalTo(code)));
                        if (!existing.exists()) break;
                        attempts++;
                    } while (attempts < 10);
                    return code;
                }

                window.closeModals = function () {
                    document.getElementById('modal-create-group').style.display = 'none';
                    document.getElementById('modal-join-group').style.display = 'none';
                    document.getElementById('createGroupError').classList.add('hidden');
                    document.getElementById('joinPrivateGroupError').classList.add('hidden');
                };

                // Focus trap & Escape key for modals
                document.addEventListener('keydown', (e) => {
                    const createModal = document.getElementById('modal-create-group');
                    const joinModal = document.getElementById('modal-join-group');
                    const isModalOpen = createModal.style.display === 'flex' || joinModal.style.display === 'flex';
                    if (e.key === 'Escape' && isModalOpen) {
                        closeModals();
                    }
                });

                let _lastFocusedElement = null;

                window.showCreateGroupModal = function () {
                    _lastFocusedElement = document.activeElement;
                    closeModals();
                    const modal = document.getElementById('modal-create-group');
                    modal.style.display = 'flex';
                    modal.focus();
                };

                window.showJoinGroupModal = function () {
                    _lastFocusedElement = document.activeElement;
                    closeModals();
                    const modal = document.getElementById('modal-join-group');
                    modal.style.display = 'flex';
                    modal.focus();
                    loadPublicGroups();
                };

                // Restore focus on close
                const _origCloseModals = window.closeModals;
                window.closeModals = function () {
                    _origCloseModals();
                    if (_lastFocusedElement) { _lastFocusedElement.focus(); _lastFocusedElement = null; }
                };

                window.createGroup = async function () {
                    const name = document.getElementById('createGroupName').value.trim();
                    const visibility = document.getElementById('createGroupVisibility').value;
                    const errorDiv = document.getElementById('createGroupError');

                    if (!name) {
                        errorDiv.textContent = "Please enter a group name.";
                        errorDiv.classList.remove('hidden');
                        return;
                    }

                    try {
                        // Check if user already created a group
                        const userSnapshot = await get(ref(db, `users/${currentUser.uid}/createdGroup`));
                        if (userSnapshot.exists()) {
                            errorDiv.textContent = "You have already created a group. Maximum 1 group per user.";
                            errorDiv.classList.remove('hidden');
                            return;
                        }

                        // Create the group ref
                        const newGroupRef = push(ref(db, 'groups'));
                        const groupId = newGroupRef.key;

                        let inviteCode = null;
                        if (visibility === 'private') {
                            inviteCode = await generateInviteCode();
                        }

                        // Atomic multi-path update — all succeed or all fail
                        const updates = {};
                        updates[`groups/${groupId}`] = {
                            name: name,
                            visibility: visibility,
                            inviteCode: inviteCode,
                            creatorId: currentUser.uid,
                            createdAt: serverTimestamp()
                        };
                        updates[`users/${currentUser.uid}/createdGroup`] = groupId;
                        updates[`group_members/${groupId}/${currentUser.uid}`] = true;
                        updates[`user_groups/${currentUser.uid}/${groupId}`] = {
                            name: name,
                            isCreator: true,
                            inviteCode: inviteCode || null
                        };
                        await update(ref(db), updates);

                        closeModals();
                        switchContext(groupId, name, true, inviteCode);

                    } catch (e) {
                        console.error(e);
                        errorDiv.textContent = "Error creating group. " + e.message;
                        errorDiv.classList.remove('hidden');
                    }
                };

                function listenToMyGroups() {
                    if (!currentUser) return;

                    const userGroupsRef = ref(db, `user_groups/${currentUser.uid}`);
                    myGroupsListener = onValue(userGroupsRef, (snapshot) => {
                        myGroupsList.innerHTML = '';
                        const groups = snapshot.val();
                        if (groups) {
                            Object.entries(groups).forEach(([groupId, details]) => {
                                const btn = document.createElement('button');
                                btn.id = `btn-group-${groupId}`;
                                btn.className = 'w-full text-left px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 font-medium transition truncate text-sm flex justify-between items-center group';
                                btn.onclick = () => switchContext(groupId, details.name, details.isCreator, details.inviteCode);

                                btn.innerHTML = `
                            <span class="truncate">${escapeHTML(details.name)}</span>
                            ${details.isCreator ? '<span class="text-[10px] bg-blue-100 text-blue-800 px-1 py-0.5 rounded ml-1">Admin</span>' : ''}
                        `;
                                myGroupsList.appendChild(btn);
                            });
                        } else {
                            myGroupsList.innerHTML = '<div class="text-xs text-gray-400 italic px-2">No groups joined yet...</div>';
                        }
                    });
                }

                async function loadPublicGroups() {
                    const listDiv = document.getElementById('public-groups-list');
                    listDiv.innerHTML = '<div class="text-center text-sm text-gray-500 py-4">Loading public groups...</div>';

                    try {
                        const snapshot = await get(ref(db, 'groups'));
                        if (snapshot.exists()) {
                            listDiv.innerHTML = '';
                            let foundPublic = false;
                            snapshot.forEach(childSnapshot => {
                                const group = childSnapshot.val();
                                if (group.visibility === 'public') {
                                    foundPublic = true;
                                    const div = document.createElement('div');
                                    div.className = "flex justify-between items-center p-2 bg-gray-50 rounded border";
                                    div.innerHTML = `
                                <div class="truncate pr-2">
                                    <h4 class="font-bold text-sm text-gray-800 truncate">${escapeHTML(group.name)}</h4>
                                    <p class="text-[10px] text-gray-500">Public Group</p>
                                </div>
                                <button class="px-3 py-1 bg-white border border-gray-300 text-xs font-bold rounded hover:bg-gray-50 text-blue-600 transition" data-group-id="${childSnapshot.key}" data-group-name="${escapeHTML(group.name)}">Join</button>
                            `;
                                    const joinBtn = div.querySelector('button');
                                    joinBtn.addEventListener('click', () => joinPublicGroup(childSnapshot.key, group.name));
                                    listDiv.appendChild(div);
                                }
                            });

                            if (!foundPublic) {
                                listDiv.innerHTML = '<div class="text-center text-sm text-gray-500 py-4">No public groups found.</div>';
                            }
                        } else {
                            listDiv.innerHTML = '<div class="text-center text-sm text-gray-500 py-4">No public groups found.</div>';
                        }
                    } catch (e) {
                        listDiv.innerHTML = '<div class="text-center text-sm text-red-500 py-4">Error loading groups.</div>';
                    }
                }

                window.joinPublicGroup = async function (groupId, groupName) {
                    await doJoinGroup(groupId, groupName);
                };

                window.joinPrivateGroup = async function () {
                    const inviteCode = document.getElementById('joinGroupCode').value.trim().toUpperCase();
                    const errorDiv = document.getElementById('joinPrivateGroupError');
                    if (!inviteCode) {
                        errorDiv.textContent = "Please enter an invite code.";
                        errorDiv.classList.remove('hidden');
                        return;
                    }

                    try {
                        // Find group by inviteCode
                        const groupsQuery = query(ref(db, 'groups'), orderByChild('inviteCode'), equalTo(inviteCode));
                        const snapshot = await get(groupsQuery);

                        if (!snapshot.exists()) {
                            errorDiv.textContent = "Group not found. Invalid code.";
                            errorDiv.classList.remove('hidden');
                            return;
                        }

                        // Get the first matched group (invite code should be unique enough for our scale)
                        let groupId;
                        let groupData;
                        snapshot.forEach(child => {
                            groupId = child.key;
                            groupData = child.val();
                        });

                        await doJoinGroup(groupId, groupData.name, groupData.inviteCode);
                    } catch (e) {
                        errorDiv.textContent = "Error: " + e.message;
                        errorDiv.classList.remove('hidden');
                    }
                };

                async function doJoinGroup(groupId, groupName, inviteCode = null) {
                    try {
                        await set(ref(db, `group_members/${groupId}/${currentUser.uid}`), true);
                        await set(ref(db, `user_groups/${currentUser.uid}/${groupId}`), {
                            name: groupName,
                            isCreator: false,
                            inviteCode: inviteCode || null
                        });
                        closeModals();
                        switchContext(groupId, groupName, false, inviteCode);
                    } catch (e) {
                        console.error("Error joining group:", e);
                        alert("Failed to join group.");
                    }
                }

                window.leaveGroup = async function (groupId) {
                    if (!confirm("Are you sure you want to leave this group?")) return;
                    try {
                        await remove(ref(db, `group_members/${groupId}/${currentUser.uid}`));
                        await remove(ref(db, `user_groups/${currentUser.uid}/${groupId}`));
                        switchContext('general', 'General Chat');
                    } catch (e) {
                        console.error(e);
                        alert("Failed to leave group.");
                    }
                };

                window.deleteGroup = async function (groupId) {
                    if (!confirm("WARNING: Are you sure you want to DELETE this group? This action cannot be undone.")) return;
                    try {
                        // First, fetch all members so we can clean up user_groups for every member
                        const membersSnap = await get(ref(db, `group_members/${groupId}`));

                        // Build atomic multi-path delete
                        const updates = {};
                        updates[`groups/${groupId}`] = null;
                        updates[`users/${currentUser.uid}/createdGroup`] = null;
                        updates[`group_messages/${groupId}`] = null;
                        updates[`group_members/${groupId}`] = null; // Removes entire members node

                        // Remove groupId from every member's user_groups
                        if (membersSnap.exists()) {
                            membersSnap.forEach(memberChild => {
                                updates[`user_groups/${memberChild.key}/${groupId}`] = null;
                            });
                        }

                        await update(ref(db), updates);
                        switchContext('general', 'General Chat');
                    } catch (e) {
                        console.error(e);
                        alert("Failed to delete group.");
                    }
                };

            </script>

            <!-- Create Group Modal -->
            <div id="modal-create-group" class="fixed inset-0 bg-gray-900 bg-opacity-50 items-center justify-center p-4"
                style="display:none" role="dialog" aria-modal="true" aria-labelledby="createGroupTitle" tabindex="-1">
                <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
                    <h3 id="createGroupTitle" class="text-xl font-bold font-display mb-4">Create Group</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Group Name</label>

                                class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Visibility</label>
                            <select id="createGroupVisibility"
                                class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="public">Public (Anyone can see and join)</option>
                                <option value="private">Private (Invite code required)</option>
                            </select>
                        </div>
                        <div id="createGroupError" class="text-red-500 text-sm hidden"></div>
                    </div>
                    <div class="mt-6 flex gap-3 justify-end">
                        <button onclick="closeModals()"
                            class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
                        <button onclick="createGroup()"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Create</button>
                    </div>
                </div>
            </div>

            <!-- Join Group Modal -->
            <div id="modal-join-group" class="fixed inset-0 bg-gray-900 bg-opacity-50 items-center justify-center p-4"
                style="display:none" role="dialog" aria-modal="true" aria-labelledby="joinGroupTitle" tabindex="-1">
                <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl flex flex-col max-h-[80vh]">
                    <h3 id="joinGroupTitle" class="text-xl font-bold font-display mb-4">Join a Group</h3>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Join Private Group using
                            Code</label>
                        <div class="flex gap-2">
                            <input type="text" id="joinGroupCode" placeholder="Enter Invite Code"
                                class="flex-grow px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <button onclick="joinPrivateGroup()"
                                class="px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-900 whitespace-nowrap">Join</button>
                        </div>
                        <div id="joinPrivateGroupError" class="text-red-500 text-sm mt-1 hidden"></div>
                    </div>

                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-gray-200"></div>
                        <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">OR DISCOVER PUBLIC</span>
                        <div class="flex-grow border-t border-gray-200"></div>
                    </div>

                    <div class="flex-grow overflow-y-auto mt-2 border rounded-lg p-2 space-y-2 max-h-48"
                        id="public-groups-list">
                        <div class="text-center text-sm text-gray-500 py-4">Loading public groups...</div>
                    </div>

                    <div class="mt-6 flex justify-end">
                        <button onclick="closeModals()"
                            class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Close</button>
                    </div>
                </div>
            </div>

</body>

</html>
