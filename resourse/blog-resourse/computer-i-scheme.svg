<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="50%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#312e81" />
        </linearGradient>

        <!-- Accent Gradient for abstract shapes -->
        <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.2"/>
        </linearGradient>

        <linearGradient id="accentGradPink" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
        </linearGradient>

        <!-- Drop shadow for text -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
        
        <!-- Glow effect -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bgGrad)" />

    <!-- Abstract Shapes -->
    <circle cx="1050" cy="100" r="300" fill="url(#accentGrad)" />
    <circle cx="150" cy="550" r="250" fill="url(#accentGradPink)" />
    <path d="M 1200 630 L 800 630 L 1200 200 Z" fill="url(#accentGrad)" opacity="0.5" />
    <path d="M 0 0 L 400 0 L 0 400 Z" fill="url(#accentGradPink)" opacity="0.4" />

    <!-- Grid overlay for tech feel -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.05">
        <path d="M 100 0 V 630 M 200 0 V 630 M 300 0 V 630 M 400 0 V 630 M 500 0 V 630 M 600 0 V 630 M 700 0 V 630 M 800 0 V 630 M 900 0 V 630 M 1000 0 V 630 M 1100 0 V 630" />
        <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200 M 0 400 H 1200 M 0 500 H 1200 M 0 600 H 1200" />
    </g>

    <!-- Floating UI elements / Cards to simulate "papers/notes" -->
    <g transform="translate(850, 180) rotate(15)" opacity="0.9">
        <rect width="240" height="320" rx="16" fill="#ffffff" opacity="0.1" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
        <rect x="20" y="30" width="140" height="15" rx="7" fill="#60a5fa" />
        <rect x="20" y="60" width="200" height="10" rx="5" fill="#cbd5e1" opacity="0.5" />
        <rect x="20" y="80" width="180" height="10" rx="5" fill="#cbd5e1" opacity="0.5" />
        <rect x="20" y="100" width="190" height="10" rx="5" fill="#cbd5e1" opacity="0.5" />
        
        <circle cx="200" cy="270" r="25" fill="#3b82f6" />
        <path d="M190 270 L200 280 L212 260" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    
    <g transform="translate(750, 240) rotate(-5)" opacity="0.95">
        <rect width="240" height="320" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
        <rect x="20" y="30" width="140" height="15" rx="7" fill="#2563eb" />
        <rect x="20" y="60" width="200" height="10" rx="5" fill="#94a3b8" />
        <rect x="20" y="80" width="180" height="10" rx="5" fill="#94a3b8" />
        <rect x="20" y="100" width="190" height="10" rx="5" fill="#94a3b8" />
        <rect x="20" y="160" width="200" height="100" rx="8" fill="#f1f5f9" />
        <circle cx="120" cy="210" r="30" fill="#3b82f6" opacity="0.2"/>
        <circle cx="120" cy="210" r="15" fill="#2563eb" />
    </g>

    <!-- Main Text Content -->
    <g transform="translate(100, 240)">
        <rect x="-10" y="-45" width="160" height="40" rx="20" fill="#ec4899" filter="url(#shadow)"/>
        <text x="15" y="-18" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="2">MSBTE I-SCHEME</text>

        <text x="0" y="60" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="76" fill="#ffffff" filter="url(#shadow)" letter-spacing="-1">
            COMPUTER ENGG.
        </text>
        <text x="0" y="150" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="76" fill="#60a5fa" filter="url(#glow)" letter-spacing="-1">
            QUESTION PAPERS
        </text>
        
        <text x="0" y="210" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="28" fill="#cbd5e1" filter="url(#shadow)">
            Semesters 1 to 5 | Model Answers | Free PDF
        </text>
        
        <!-- Badges -->
        <g transform="translate(0, 250)">
            <rect x="0" y="0" width="120" height="40" rx="8" fill="#3b82f6" opacity="0.2" />
            <rect x="0" y="0" width="120" height="40" rx="8" stroke="#3b82f6" stroke-width="2" fill="none" />
            <text x="60" y="26" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="16" fill="#60a5fa" text-anchor="middle">100% FREE</text>
            
            <rect x="140" y="0" width="150" height="40" rx="8" fill="#10b981" opacity="0.2" />
            <rect x="140" y="0" width="150" height="40" rx="8" stroke="#10b981" stroke-width="2" fill="none" />
            <text x="215" y="26" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="16" fill="#34d399" text-anchor="middle">OFFICIAL PDFs</text>
        </g>
    </g>

    <!-- Footer Logo / Branding -->
    <g transform="translate(100, 560)">
        <circle cx="20" cy="20" r="20" fill="#ffffff" />
        <path d="M12 18 L20 10 L28 18 M12 28 L20 20 L28 28" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="50" y="28" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="24" fill="#ffffff">MSBTE Notes &amp; Info</text>
    </g>
</svg>
