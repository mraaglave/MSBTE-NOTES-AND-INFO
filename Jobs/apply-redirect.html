<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Job Application...</title>
    <meta name="robots" content="noindex, nofollow"> <!-- Important for SEO -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9227354288966999" crossorigin="anonymous"></script>
    <style>
        .loader {
            border-top-color: #2563EB;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-lg">
        <div class="bg-white p-8 rounded-lg shadow-lg text-center mb-8">
            <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-20 w-20 mx-auto mb-6"></div>
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Please wait, we are redirecting you...</h1>
            <p class="text-gray-600 mb-6">You will be redirected to the job application page in <span id="countdown" class="font-bold text-blue-600">5</span> seconds.</p>
            <p class="text-sm text-gray-500">
                If you are not redirected, <a id="manualRedirectLink" href="#" class="text-blue-600 hover:underline">click here to proceed</a>.
            </p>
        </div>

        <!-- Ad Container -->
        <div class="ad-container min-h-[100px] text-center">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-9227354288966999"
                data-ad-slot="2993401987" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const countdownElement = document.getElementById('countdown');
            const manualRedirectLink = document.getElementById('manualRedirectLink');
            
            const urlParams = new URLSearchParams(window.location.search);
            const targetUrl = urlParams.get('url');

            if (!targetUrl) {
                document.body.innerHTML = '<p class="text-center text-red-500">Error: No redirect URL provided.</p>';
                return;
            }

            manualRedirectLink.href = targetUrl;
            let seconds = 5;

            const interval = setInterval(() => {
                seconds--;
                countdownElement.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                    window.location.href = targetUrl;
                }
            }, 1000);
        });
    </script>
</body>
</html>
