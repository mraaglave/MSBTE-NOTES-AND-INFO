    <script type="application/ld+json">

      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Student Directory Form | MSBTE Notes & Info",
      "description": "Welcome to the MSBTE Notes & Info Student Directory. Join our growing community of diploma engineering students. By filling out this form, you get access to the latest MSBTE updates, notes, study materials, and K-scheme & I-scheme resources right to your inbox.",

        "logo": {
          "@type": "ImageObject",
          "url": "https://msbtenotes-info.netlify.app/resourse/MSBTE%20NOTES%20AND%20INFORMATION.png"

    <!-- Favicon and App Icons -->
    <link rel="icon" href="../resourse/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="../resourse/apple-touch-icon.png">

    <!-- ═══ ASSETS & STYLES ═════════════════════════════════════════ -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap" rel="stylesheet">

    <style>
        .font-display {
            font-family: 'Clash Display', sans-serif;
        }

        /* Custom scrollbar for selects */
        select {
            appearance: none;
            background-color: transparent;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 1rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            /* Ensure text doesn't overlap default arrow area */
        }

        /* Remove default blue outline on selects and inputs universally on focus */
        input:focus,
        select:focus {
            outline: none;
        }

        /* Improved Form Element Spacing & Focus States */
        input,
        select {
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out, background-color 0.2s ease-in-out;
        }

        /* Subtle logo animation */
        .logo-hover {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo-hover:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body
    class="bg-gray-50 text-gray-900 font-sans antialiased relative min-h-screen flex flex-col justify-center overflow-x-hidden">

    <!-- Background Design (Decorative) -->
    <div
        class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-100 rounded-full blur-[100px] z-0 pointer-events-none opacity-60">
    </div>
    <div
        class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-indigo-100 rounded-full blur-[100px] z-0 pointer-events-none opacity-60">
    </div>

    <!-- Main Content Container -->
    <main class="w-full max-w-2xl mx-auto p-4 sm:p-6 lg:p-8 relative z-10 flex-grow flex items-center justify-center">

        <div
            class="w-full bg-white rounded-2xl sm:rounded-3xl shadow-xl overflow-hidden p-6 sm:p-10 border border-gray-100">

            <!-- Header Section with Logo -->
            <header class="text-center mb-8 flex flex-col items-center">
                <a href="../index.html" class="inline-block mb-4">
                    <img src="../resourse\android-chrome-512x512.png" alt="MSBTE Notes & Info Logo"
                        class="h-20 w-auto logo-hover object-contain drop-shadow-sm">
                </a>
                <h1 class="text-3xl sm:text-4xl font-display font-bold text-blue-600 mb-3 tracking-tight">Student
                    Directory</h1>
                <p class="text-gray-500 text-sm sm:text-base max-w-md mx-auto">
                    Whether you are new here or a regular visitor, please provide your academic details below. Join
                    Maharashtra's largest MSBTE diploma network to get exclusive notes, resources, and updates sent
                    straight to you!
                </p>
            </header>

            <!-- Netlify Form -->
            <form name="student-data" method="POST" data-netlify="true" action="/form/success.html"
                class="space-y-5 sm:space-y-6">
                <!-- Netlify hidden bot-field for spam prevention -->
                <input type="hidden" name="form-name" value="student-data" />
                <p class="hidden">
                    <label>Don’t fill this out if you're human: <input name="bot-field" /></label>
                </p>

                <!-- Full Name -->
                <div>
                    <label for="fullName" class="block text-sm font-bold text-gray-700 mb-2">Full Name <span
                            class="text-red-500">*</span></label>
                    <input type="text" id="fullName" name="fullName" placeholder="e.g. Rahul Sharma" required
                        class="w-full px-4 py-3.5 sm:py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 focus:bg-white text-gray-800 placeholder-gray-400">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6">
                    <!-- Phone Number -->
                    <div>
                        <label for="phone" class="block text-sm font-bold text-gray-700 mb-2">Phone Number <span
                                class="text-red-500">*</span></label>
                        <input type="tel" id="phone" name="phone" placeholder="e.g. +91 9876543210"
                            pattern="[\+0-9\-\s]+" required
                            class="w-full px-4 py-3.5 sm:py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 focus:bg-white text-gray-800 placeholder-gray-400">
                    </div>

                    <!-- Email Address -->
                    <div>
                        <label for="email" class="block text-sm font-bold text-gray-700 mb-2">Email Address <span
                                class="text-red-500">*</span></label>
                        <input type="email" id="email" name="email" placeholder="e.g. student@college.edu" required
                            class="w-full px-4 py-3.5 sm:py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 focus:bg-white text-gray-800 placeholder-gray-400">
                    </div>
                </div>

                <!-- College Name -->
                <div>
                    <label for="college" class="block text-sm font-bold text-gray-700 mb-2">College Name <span
                            class="text-red-500">*</span></label>
                    <input type="text" id="college" name="college" placeholder="e.g. Government Polytechnic, Pune"
                        required
                        class="w-full px-4 py-3.5 sm:py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 focus:bg-white text-gray-800 placeholder-gray-400">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6">
                    <!-- Branch -->
                    <div>
                        <label for="branch" class="block text-sm font-bold text-gray-700 mb-2">Branch <span
                                class="text-red-500">*</span></label>
                        <div class="relative">
                            <select id="branch" name="branch" required
                                class="w-full px-4 py-3.5 sm:py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 focus:bg-white text-gray-800">
                                <option value="" disabled selected>Select Branch</option>
                                <option value="Computer Engineering(CO)">Computer Engineering (CO)</option>
                                <option value="Information Technology(IF)">Information Technology (IF)</option>
                                <option value="Artificial Intelligence(AI)">Artificial Intelligence (AI)</option>
                                <option value="Civil Engineering(CE)">Civil Engineering (CE)</option>
                                <option value="Mechanical Engineering(ME)">Mechanical Engineering (ME)</option>
                                <option value="Electrical Engineering(EE)">Electrical Engineering (EE)</option>
                                <option value="Electronics & Telecom(EJ)">Electronics & Telecom (EJ)</option>
                                <option value="Other">Other Branch</option>
                            </select>
                        </div>
                    </div>

                    <!-- Year -->
                    <div>
                        <label for="year" class="block text-sm font-bold text-gray-700 mb-2">Year <span
                                class="text-red-500">*</span></label>
                        <select id="year" name="year" required
                            class="w-full px-4 py-3.5 sm:py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 focus:bg-white text-gray-800">
                            <option value="" disabled selected>Select Year</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6">
                    <!-- Semester -->
                    <div>
                        <label for="semester" class="block text-sm font-bold text-gray-700 mb-2">Semester <span
                                class="text-red-500">*</span></label>
                        <select id="semester" name="semester" required
                            class="w-full px-4 py-3.5 sm:py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 focus:bg-white text-gray-800">
                            <option value="" disabled selected>Select Semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                        </select>
                    </div>

                    <!-- Scheme -->
                    <div>
                        <label for="scheme" class="block text-sm font-bold text-gray-700 mb-2">Scheme <span
                                class="text-red-500">*</span></label>
                        <select id="scheme" name="scheme" required
                            class="w-full px-4 py-3.5 sm:py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 focus:bg-white text-gray-800">
                            <option value="" disabled selected>Select Scheme</option>
                            <option value="K Scheme">K Scheme</option>
                            <option value="I Scheme">I Scheme</option>
                        </select>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl transition-all duration-200 shadow-[0_4px_14px_0_rgba(37,99,235,0.39)] hover:shadow-[0_6px_20px_rgba(37,99,235,0.23)] hover:-translate-y-0.5 active:translate-y-0 flex justify-center items-center text-lg">
                        Submit Information
                    </button>
                    <p class="text-center text-xs text-gray-400 mt-4">By submitting, you consent to our privacy policy
                        and terms.</p>
                </div>
            </form>

        </div>
    </main>

</body>

</html>
