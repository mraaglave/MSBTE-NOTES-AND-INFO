<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Mock Test | MSBTE Diploma Quiz</title>
    <meta name="description" content="Attempt MSBTE mock tests and practice quizzes. Test your diploma knowledge interactively, get instant scores, and identify areas to improve.">
    <meta name="keywords" content="MSBTE test, diploma mock test, interactive quiz, MSBTE scoring, past papers MCQ">
    <meta property="og:title" content="Take MSBTE Mock Test">
    <meta property="og:description" content="Interactive practice exams for MSBTE diploma students. Take the quiz now to test your knowledge!">
    <meta property="og:type" content="article">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .font-display { font-family: 'Clash Display', sans-serif; }
        .option-label { cursor: pointer; }
        .option-radio:checked + .option-label {
            border-color: #2563eb;
            background-color: #eff6ff;
        }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans flex flex-col min-h-screen">
    <nav class="bg-white shadow z-40 flex-none h-[64px] border-b border-gray-100 sticky top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- App Title -->
                <div class="font-display font-bold text-lg text-gray-800 flex items-center gap-2">
                    <span class="w-8 h-8 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    </span>
                    <span class="text-gray-900 truncate max-w-[150px] md:max-w-md" id="navTestTitle">Loading Test...</span>
                </div>
                <div>
                    <a href="index.html" class="flex items-center gap-1.5 text-sm font-bold text-gray-500 hover:text-red-500 bg-gray-100 px-3 py-1.5 rounded-lg transition" onclick="return confirm('Are you sure you want to exit? Your progress will be lost.')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        <span class="hidden sm:inline">Exit Test</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8 md:py-12">
        
        <div id="loading" class="flex flex-col items-center justify-center py-20 text-gray-500">
            <svg class="w-10 h-10 animate-spin text-blue-600 mb-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="font-medium text-lg">Preparing your test environment...</span>
        </div>
        
        <div id="testContainer" class="hidden">
            <div class="mb-10 text-center">
                <h1 id="testTitle" class="text-3xl md:text-4xl font-display font-extrabold text-blue-600 mb-3"></h1>
                <p id="testDescription" class="text-gray-600 text-lg max-w-2xl mx-auto"></p>
            </div>

            <form id="testForm" onsubmit="submitTest(event)" class="space-y-8">
                <div id="questionsContainer" class="space-y-6">
                    <!-- Questions injected here -->
                </div>
                
                <div class="pt-8 pb-12 border-t border-gray-200 mt-10 sticky bottom-0 bg-gray-50/90 backdrop-blur pb-8 z-30 flex justify-center">
                    <button id="submitBtn" type="submit" class="w-full md:w-auto md:px-16 bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 active:scale-[0.98] transition-all shadow-xl shadow-blue-200 text-lg flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Submit Test
                    </button>
                </div>
            </form>
        </div>

        <!-- Results Modal -->
        <div id="resultsModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl transform scale-100 transition-transform">
                <div class="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 class="text-3xl font-bold font-display text-gray-900 mb-2">Test Completed!</h2>
                <p class="text-gray-500 mb-8 font-medium">Your results have been securely recorded.</p>
                
                <div class="bg-blue-50 rounded-2xl p-6 mb-8 border border-blue-100">
                    <div class="text-sm text-blue-600 font-bold uppercase tracking-wider mb-1">Final Score</div>
                    <div class="text-5xl font-black text-blue-700" id="scoreDisplay"></div>
                </div>
                
                <div class="flex flex-col gap-3">
                    <button onclick="closeModalAndScroll()" class="w-full bg-gray-100 text-gray-700 font-bold py-3.5 rounded-xl hover:bg-gray-200 transition">Review Answers</button>
                    <a href="index.html" class="block w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition">Return to Dashboard</a>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-400 text-sm font-medium">
                © 2026 MSBTE Notes &amp; Info - Student Portal Platform
            </p>
        </div>
    </footer>

    <script type="module" src="js/test.js"></script>
</body>
</html>
