<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Mock Test | MSBTE Diploma Quiz</title>
    <meta name="description" content="Attempt MSBTE mock tests and practice quizzes. Test your diploma knowledge interactively, get instant scores, and identify areas to improve.">
    <meta name="keywords" content="MSBTE test, diploma mock test, interactive quiz, MSBTE scoring, past papers MCQ">
    <meta property="og:title" content="Take MSBTE Mock Test">
    <meta property="og:description" content="Interactive practice exams for MSBTE diploma students. Take the quiz now to test your knowledge!">
    <meta property="og:type" content="article">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .font-display { font-family: 'Clash Display', sans-serif; }
        
        /* Option Styling */
        .opt-radio:checked + .opt-label { border-color: #2563eb; background: #eff6ff; }
        .opt-radio:checked + .opt-label .opt-dot { border-color: #2563eb; background: #2563eb; }
        .opt-radio:checked + .opt-label .opt-dot svg { opacity: 1; color: #fff; }
        .opt-label:hover { background: #f9fafb; border-color: #d1d5db; }
        
        /* Result Styling */
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; }
        .unanswered-answer { background-color: #fff7ed !important; border-color: #f97316 !important; }
        
        /* Timer danger */
        .timer-danger { animation: pulse-red 1s ease-in-out infinite; }
        @keyframes pulse-red { 0%,100%{ color:#ef4444; } 50%{ color:#fca5a5; } }
        
        /* Nav button states */
        .q-dot { transition: all 0.15s; }
        .q-dot.answered { background: #2563eb; color: #fff; border-color: #2563eb; }
        .q-dot.skipped { background: #fff7ed; color: #ea580c; border-color: #fdba74; }
        .q-dot.current { box-shadow: 0 0 0 3px rgba(37,99,235,0.25); border-color: #2563eb; }
        .q-dot.review-correct { background: #dcfce7; color: #16a34a; border-color: #22c55e; }
        .q-dot.review-wrong { background: #fee2e2; color: #ef4444; border-color: #ef4444; }
        .q-dot.review-skipped { background: #fff7ed; color: #f97316; border-color: #f97316; }
        
        /* Slide animation */
        .q-card { animation: fadeSlideIn 0.25s ease-out; }
        @keyframes fadeSlideIn { from { opacity:0; transform:translateX(12px); } to { opacity:1; transform:translateX(0); } }
        
        /* Progress bar */
        .progress-fill { transition: width 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans flex flex-col min-h-screen">

    <!-- ─── Top Nav ─── -->
    <nav class="bg-white shadow-sm z-40 flex-none border-b border-gray-100 sticky top-0">
        <div class="max-w-5xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-14">
                <div class="flex items-center gap-2 min-w-0">
                    <a href="../index.html" class="hidden md:flex items-center text-blue-600 font-bold text-lg font-display group mr-2" id="exitLogoLink">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-1.5" viewBox="0 0 576 512" fill="currentColor"><path d="M249.6 471.5c10.8 3.8 22.4-4.1 22.4-15.5V78.6c0-4.2-1.6-8.4-5-11C247.4 52 202.4 32 144 32C93.5 32 46.3 45.3 18.1 56.1C6.8 60.5 0 71.7 0 83.8V454.1c0 11.9 12.8 20.2 24.1 16.5C55.6 460.1 105.5 448 144 448c33.9 0 79 14 105.6 23.5zm76.8 0C353 462 398.1 448 432 448c38.5 0 88.4 12.1 119.9 22.6c11.3 3.8 24.1-4.6 24.1-16.5V83.8c0-12.1-6.8-23.3-18.1-27.6C529.7 45.3 482.5 32 432 32c-58.4 0-103.4 20-123 35.6c-3.3 2.6-5 6.8-5 11V456c0 11.4 11.7 19.3 22.4 15.5z"/></svg>
                        MSBTE
                    </a>
                    <span class="text-gray-300 hidden md:inline">|</span>
                    <span class="text-sm font-bold text-gray-700 truncate max-w-[140px] sm:max-w-[240px]" id="navTestTitle">Loading...</span>
                </div>
                <div class="flex items-center gap-2">
                    <!-- Timer -->
                    <div id="timerBox" class="hidden items-center gap-1.5 bg-gray-100 px-2.5 py-1 rounded-lg border border-gray-200">
                        <svg class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span id="timerText" class="font-mono font-bold text-xs text-gray-700">00:00</span>
                    </div>
                    <!-- Question Counter -->
                    <div class="bg-blue-50 border border-blue-100 px-2.5 py-1 rounded-lg">
                        <span class="text-xs font-bold text-blue-700"><span id="navCurrent">1</span>/<span id="navTotal">0</span></span>
                    </div>
                    <!-- Exit -->
                    <button onclick="showExitModal()" class="flex items-center gap-1 text-xs font-bold text-gray-500 hover:text-red-500 bg-gray-100 px-2.5 py-1.5 rounded-lg transition">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        <span class="hidden sm:inline">Exit</span>
                    </button>
                </div>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="h-1 bg-gray-100">
            <div id="progressBar" class="progress-fill h-full bg-blue-600 rounded-r-full" style="width:0%"></div>
        </div>
    </nav>

    <!-- ─── Loading ─── -->
    <div id="loading" class="flex-grow flex flex-col items-center justify-center py-20 text-gray-500">
        <svg class="w-10 h-10 animate-spin text-blue-600 mb-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="font-medium text-lg">Preparing your test environment...</span>
    </div>

    <!-- ─── Main Test Container ─── -->
    <div id="testContainer" class="hidden flex-grow flex flex-col">
        <div class="max-w-3xl mx-auto w-full px-4 py-6 flex-grow flex flex-col">

            <!-- Promo Banner -->
            <div id="promoBanner" class="hidden mb-4">
                <a id="promoLink" href="#" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-xl p-3 hover:shadow-md transition-all group">
                    <div class="w-8 h-8 bg-amber-100 rounded-lg flex items-center justify-center flex-shrink-0">
                        <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    </div>
                    <p id="promoText" class="text-xs font-bold text-amber-800 truncate flex-grow">Study Material</p>
                    <svg class="w-4 h-4 text-amber-400 group-hover:translate-x-1 transition-transform flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
            </div>

            <!-- Question Dots Navigator -->
            <div class="mb-4 bg-white rounded-xl border border-gray-200 shadow-sm p-3">
                <div id="dotsNav" class="flex flex-wrap gap-1.5 justify-center"></div>
            </div>

            <!-- Single Question Card -->
            <div id="questionCard" class="flex-grow flex flex-col">
                <!-- Populated by JS -->
            </div>

            <!-- Bottom Navigation Buttons -->
            <div id="bottomNav" class="mt-4 flex items-center justify-between gap-3 bg-white rounded-xl border border-gray-200 shadow-sm p-3 sm:p-4">
                <button id="prevBtn" onclick="goToPrev()" class="flex items-center gap-1.5 text-sm font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 px-4 py-2.5 rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    <span class="hidden sm:inline">Previous</span>
                </button>
                <div class="flex items-center gap-2">
                    <button id="skipBtn" onclick="skipQuestion()" class="flex items-center gap-1.5 text-sm font-bold text-orange-600 bg-orange-50 hover:bg-orange-100 border border-orange-200 px-4 py-2.5 rounded-xl transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
                        Skip
                    </button>
                    <button id="nextBtn" onclick="goToNext()" class="flex items-center gap-1.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 px-5 py-2.5 rounded-xl shadow-md shadow-blue-200 transition">
                        Next
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
                <button id="submitTestBtn" onclick="showSubmitModal()" class="flex items-center gap-1.5 text-sm font-bold text-white bg-green-600 hover:bg-green-700 px-5 py-2.5 rounded-xl shadow-md shadow-green-200 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Submit
                </button>
            </div>
        </div>
    </div>

    <!-- ─── Review Container (after submit) ─── -->
    <div id="reviewContainer" class="hidden flex-grow">
        <div class="max-w-3xl mx-auto w-full px-4 py-6">
            <!-- Score Summary -->
            <div id="scoreSummary" class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mb-4 text-center"></div>
            <!-- Review Promo -->
            <div id="reviewPromoBanner" class="hidden mb-4">
                <a id="reviewPromoLink" href="#" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-xl p-3 hover:shadow-md transition-all group">
                    <div class="w-8 h-8 bg-amber-100 rounded-lg flex items-center justify-center flex-shrink-0">
                        <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    </div>
                    <p id="reviewPromoText" class="text-xs font-bold text-amber-800 truncate flex-grow">Study Material</p>
                    <svg class="w-4 h-4 text-amber-400 group-hover:translate-x-1 transition-transform flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
            </div>
            <!-- Review Dots -->
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-3 mb-4">
                <div id="reviewDotsNav" class="flex flex-wrap gap-1.5 justify-center"></div>
            </div>
            <!-- Review Question Card -->
            <div id="reviewQuestionCard"></div>
            <!-- Review Nav -->
            <div class="mt-4 flex items-center justify-between bg-white rounded-xl border border-gray-200 shadow-sm p-3">
                <button onclick="reviewPrev()" id="reviewPrevBtn" class="flex items-center gap-1.5 text-sm font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 px-4 py-2.5 rounded-xl transition disabled:opacity-40">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Prev
                </button>
                <a href="index.html" class="text-sm font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 border border-blue-200 px-4 py-2.5 rounded-xl transition">Back to Dashboard</a>
                <button onclick="reviewNext()" id="reviewNextBtn" class="flex items-center gap-1.5 text-sm font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 px-4 py-2.5 rounded-xl transition disabled:opacity-40">
                    Next
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ─── Exit Modal ─── -->
    <div id="exitModal" class="hidden fixed inset-0 bg-gray-900/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center">
            <div class="w-14 h-14 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h2 class="text-lg font-bold font-display text-gray-900 mb-1">Exit Test?</h2>
            <p class="text-gray-500 text-sm mb-4">Progress will be lost.</p>
            <div class="bg-orange-50 border border-orange-200 rounded-lg p-2.5 mb-5 text-sm">
                <p class="font-bold text-orange-800">⚠️ <span id="exitUnanswered">0</span> unanswered &bull; <span id="exitTimeLeft" class="font-mono">--:--</span> left</p>
            </div>
            <div class="flex gap-3">
                <button onclick="hideExitModal()" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl hover:bg-blue-700 transition text-sm">Continue</button>
                <button onclick="confirmExit()" class="flex-1 bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl hover:bg-gray-200 transition text-sm">Exit</button>
            </div>
        </div>
    </div>

    <!-- ─── Submit Modal ─── -->
    <div id="submitModal" class="hidden fixed inset-0 bg-gray-900/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center">
            <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h2 class="text-lg font-bold font-display text-gray-900 mb-1">Submit Test?</h2>
            <p class="text-gray-500 text-sm mb-4">You cannot change answers after submitting.</p>
            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-green-50 border border-green-200 rounded-lg p-3">
                    <p class="text-2xl font-black text-green-700" id="submitAnswered">0</p>
                    <p class="text-[10px] font-bold text-green-600 uppercase">✅ Answered</p>
                </div>
                <div class="bg-orange-50 border border-orange-200 rounded-lg p-3">
                    <p class="text-2xl font-black text-orange-700" id="submitUnanswered">0</p>
                    <p class="text-[10px] font-bold text-orange-600 uppercase">⚠️ Unanswered</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="hideSubmitModal()" class="flex-1 bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl hover:bg-gray-200 transition text-sm">Cancel</button>
                <button onclick="executeSubmit()" class="flex-1 bg-green-600 text-white font-bold py-2.5 rounded-xl hover:bg-green-700 shadow-lg shadow-green-200 transition text-sm">Submit Now</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/test.js"></script>
</body>
</html>
